<!DOCTYPE html>
<html lang="ru">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Любимые лапки — Корзина и оформление</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Unbounded:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header container">
    <div class="header-brand">
        <div class="header-logo">
            <img src="img/logo.png" alt="Логотип" class="logo-icon">
            <a href="index.html" class="btn-nav btn-yellow">ЛЮБИМЫЕ ЛАПКИ</a>
        </div>
    </div>
        <nav class="header-nav">
            <a href="catalog.html" class="btn-nav btn-yellow">Каталог</a>
            <a href="answers.html" class="btn-nav btn-yellow">Ответы на вопросы</a>
            <a href="payment.html" class="btn-nav btn-yellow">Доставка и контакты</a>
            <a href="thanks for.html" class="btn-nav btn-yellow">Корзина</a>
        </nav>
    </header>
<body>

<div class="container">
    <div class="title-row">
        <h1>Корзина <span id="cartCount">1</span></h1>
    </div>

    <!-- Список товаров в корзине -->
    <div class="cart-items" id="cartItemsContainer">
        <!-- Товар по умолчанию (один) -->
        <div class="cart-item" data-product-id="1" data-price="4500">
            <img src="item 4/Frame 41.png" alt="Любимый след" class="cart-item-img" onerror="this.src='https://placehold.co/80x80/fae8cf/7a4e2a?text=Брелок'">
            <div class="cart-item-info">
                <div class="cart-item-title">Кольцо с матовым покрытием «Любимый след»</div>
                <div class="cart-item-price">3900 руб.</div>
            </div>
            <button class="cart-item-add" id="addProductBtn">Добавить товар</button>
            <button class="remove-item-btn" onclick="removeCartItem(this)">Удалить</button>
        </div>
    </div>

    <div class="cart-summary" id="cartSummary">
        Итого: <span id="totalPrice">3900</span> руб.
    </div>

    <!-- Блок с формой -->
    <div class="info-section">
        <div class="input-row">
            <label>ФИО</label>
            <input type="text" class="input-field" id="fullname" placeholder="Введите ваше ФИО">
        </div>

        <div class="input-row">
            <label>Номер телефона</label>
            <input type="tel" class="input-field" id="phone" placeholder="+7 (___) ___-__-__">
        </div>

        <div class="input-row">
            <label>Электронная почта</label>
            <input type="email" class="input-field" id="email" placeholder="example@mail.ru">
        </div>

        <div class="input-row">
            <label>Мессенджер для связи</label>
            <select class="select-field" id="messengerSelect">
                <option value="viber" selected>Viber</option>
                <option value="telegram">Telegram</option>
                <option value="vk">VK</option>
            </select>
        </div>
    </div>
</div>

<!-- Кнопка Оформить заказ (фиксированная снизу по центру) -->
<button class="order-btn-bottom" id="orderBtn">Оформить заказ</button>

<script>
    // Функция обновления счетчика и общей суммы
    function updateCartStats() {
        const cartItems = document.querySelectorAll('.cart-item');
        const cartCountSpan = document.getElementById('cartCount');
        const totalPriceSpan = document.getElementById('totalPrice');
        
        const itemCount = cartItems.length;
        cartCountSpan.textContent = itemCount;
        
        let total = 0;
        cartItems.forEach(item => {
            const price = parseInt(item.getAttribute('data-price')) || 0;
            total += price;
        });
        totalPriceSpan.textContent = total;
    }

    // Функция удаления товара из корзины
    window.removeCartItem = function(btn) {
        const cartItem = btn.closest('.cart-item');
        if (cartItem) {
            cartItem.remove();
            updateCartStats();
        }
    }

    // Функция добавления нового товара (точно такого же)
    function addNewProduct() {
        const container = document.getElementById('cartItemsContainer');
        if (!container) return;
        
        // Создаем новый элемент товара с такими же данными
        const newItem = document.createElement('div');
        newItem.className = 'cart-item';
        const newId = Date.now(); // уникальный идентификатор
        newItem.setAttribute('data-product-id', newId);
        newItem.setAttribute('data-price', '3900');
        
        newItem.innerHTML = `
            <img src="item 4/Frame 41.png" alt="Любимый след" class="cart-item-img" onerror="this.src='https://placehold.co/80x80/fae8cf/7a4e2a?text=Брелок'">
            <div class="cart-item-info">
                <div class="cart-item-title">Кольцо с матовым покрытием «Любимый след»</div>
                <div class="cart-item-price">3900 руб.</div>
            </div>
            <button class="remove-item-btn" onclick="removeCartItem(this)">Удалить</button>
        `;
        
        container.appendChild(newItem);
        updateCartStats();
        
        // Небольшая анимация скролла к новому товару (опционально)
        newItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    
    // Обработчик для кнопки "Добавить товар"
    const addBtn = document.getElementById('addProductBtn');
    if (addBtn) {
        addBtn.addEventListener('click', function() {
            addNewProduct();
        });
    }
    
    // Оформление заказа
    const orderButton = document.getElementById('orderBtn');
    if (orderButton) {
        orderButton.addEventListener('click', function() {
            // Получаем данные из формы
            const fio = document.getElementById('fullname').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const email = document.getElementById('email').value.trim();
            const messengerSelect = document.getElementById('messengerSelect');
            let messengerValue = messengerSelect.options[messengerSelect.selectedIndex]?.text || 'Viber';
            
            // Проверка обязательных полей
            if (!fio) {
                alert('Пожалуйста, введите ваше ФИО');
                return;
            }
            if (!phone) {
                alert('Пожалуйста, введите номер телефона');
                return;
            }
            if (!email) {
                alert('Пожалуйста, введите email');
                return;
            }
            
            // Собираем информацию о товарах в корзине
            const cartItems = document.querySelectorAll('.cart-item');
            const itemsList = [];
            let totalSum = 0;
            cartItems.forEach(item => {
                const titleElem = item.querySelector('.cart-item-title');
                const title = titleElem ? titleElem.innerText : 'Брелок «Лавандовая нежность»';
                const price = parseInt(item.getAttribute('data-price')) || 4500;
                itemsList.push(`${title} — ${price} руб.`);
                totalSum += price;
            });
            
            let itemsText = itemsList.map((t, idx) => `${idx+1}. ${t}`).join('\n');
            if (itemsList.length === 0) {
                itemsText = 'Нет товаров';
            }
            
            let message = 'ЗАКАЗ ОФОРМЛЕН!\n\n';
            message += `ФИО: ${fio}\n`;
            message += `Телефон: ${phone}\n`;
            message += `Email: ${email}\n`;
            message += `Мессенджер: ${messengerValue}\n\n`;
            message += `Состав заказа:\n${itemsText}\n\n`;
            message += `ОБЩАЯ СУММА: ${totalSum} руб.\n\n`;
            message += `Благодарим за заказ! Мы свяжемся с вами в течение трех дней.`;
            
            alert(message);
        });
    }
    
    // Инициализация
    updateCartStats();
    
    // Обработчик для удаления существующего товара (если кнопка есть в начальном)
    document.querySelectorAll('.remove-item-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
            // уже есть глобальная функция removeCartItem, но дублируем на всякий
            const item = this.closest('.cart-item');
            if(item) item.remove();
            updateCartStats();
        });
    });
</script>

</body>
</html>
